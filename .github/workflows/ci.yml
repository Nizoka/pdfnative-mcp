name: CI

# The `ci` job runs `scripts/gate.ts --ci`, the single definition of "green":
# the step list lives in that file's STEPS table (typecheck:all, lint, build,
# dist-check, dist-probe, smoke, verify:tool-shape, server-json, pack-manifest,
# test:generate, test:coverage, verify:docs, verify:samples, corpus:pdfa,
# validate:pdfx) and is not repeated here, so CI and the contributor loop
# cannot drift apart. `--require-all` turns any SKIP into a FAIL: a runner
# missing a tool goes red instead of quietly passing.
#
# `npm audit` runs outside the gate on purpose: the gate is hermetic (no
# network) so its verdict is the same on a laptop and on a runner.
#
# The `smoke` step drives the BUILT server (dist/cli.js) over stdio the way an
# MCP host does and fails on any stdout line that is not a JSON-RPC frame —
# source tests import the handlers directly and cannot catch that.
#
# ── Why there is no `paths-ignore:` filter ────────────────────────────
# Every job here is a REQUIRED status check (.github/rulesets/main.json). A
# path-filtered workflow simply does not run on a pull request that touches
# none of its paths, and a required check that never reports leaves the pull
# request stuck on "Expected — waiting for status to be reported", forever
# unmergeable — which is what happened to documentation-only pull requests
# until 1.8.0 (pdfnative 1.9.0 removed the same filter). The gate is cheap
# enough to run on every change.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job ids and the matrices are load-bearing: the main ruleset requires the
  # status checks `ci (22)`, `ci (24)`, `os (windows-latest)`,
  # `os (macos-latest)`, `sample-regression` and `workflow-lint`
  # (.github/rulesets/main.json).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      # Block mode with the hosts a Linux gate run reaches: the npm registry
      # (npm ci, npm audit), GitHub (checkout, the toolcache manifest) and
      # nodejs.org (a Node line missing from the runner's toolcache).
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No lifecycle script of any dependency runs on the runner; the
      # repository's own .npmrc says the same for every developer machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs-node${{ matrix.node-version }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # The stdio server is spawned by hosts on Windows and macOS too, so the same
  # gate runs there, on the pinned Node line: the built server over stdio
  # (TerminateProcess-style SIGTERM on win32, POSIX signals on macOS, CRLF and
  # path rules), the coverage run, and the sample byte baseline — which is
  # how the "byte-identical on every host" promise is proven on three
  # operating systems rather than asserted on one. Both matrix entries are
  # required status checks (.github/rulesets/main.json).
  #
  # harden-runner supports Windows runners in audit mode only, so this job
  # can never move to `egress-policy: block`; the action does not support
  # macOS at all, so the step is skipped there (`if: runner.os != 'macOS'`) —
  # the one documented exemption to "every job starts with harden-runner".
  os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Harden the runner
        if: runner.os != 'macOS'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # Windows runners: audit mode only (the action's own limit)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The same gate as the Linux matrix; `npm audit` stays on Linux (network,
      # once is enough). The gate builds before the suites that need dist/.
      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs-${{ matrix.os }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # The workflows themselves are code that holds tokens. zizmor reads them
  # for the GitHub Actions weaknesses (cache poisoning, template injection,
  # excessive permissions, unpinned or impostor actions); actionlint checks
  # the syntax, the expressions and every `run:` script through shellcheck.
  # Both pinned: the zizmor image by the digest the action pins for its
  # version, actionlint by the SHA-256 of its release archive. A required
  # check (.github/rulesets/main.json), like in pdfnative.
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # 2026-10-31: the container registry hosts behind ghcr.io (the zizmor image) are not baselined yet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          min-severity: medium
          advanced-security: false
          annotations: true

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" actionlint
          shellcheck --version | head -2
          "${RUNNER_TEMP}/actionlint" -color
