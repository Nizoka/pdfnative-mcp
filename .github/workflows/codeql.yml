name: CodeQL

# Static analysis of the TypeScript sources and of the workflows themselves
# (the `actions` language reads .github/workflows/*.yml for the weaknesses
# CodeQL models), with the security-extended query suite. No path filter: a
# change to a workflow or a script is exactly what must be scanned, and the
# weekly run covers what a push did not touch.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '27 3 * * 1'

# Read-only by default; the one write grant (security-events, to upload the
# SARIF) is scoped to the job that needs it (OpenSSF Scorecard
# Token-Permissions reads a top-level write as a workflow-wide one).
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # Upload the SARIF to the Security tab.
      actions: read # Read workflow metadata for the `actions` language.
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # 2026-10-31: the CodeQL bundle and query-pack hosts are not baselined yet

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
