name: Sample Regression

# Guards every tool against unintended output changes. Builds the server,
# regenerates every sample through the BUILT `tools/call` handler
# (scripts/generate-samples.ts → test-output/samples/) and fingerprints them
# against the committed chain at tests/_fixtures/samples.sha256.json.
#
# The baseline is a CHAIN, not a snapshot: every entry records the release its
# reference was captured at (`since`) and keeps it across rebaselines, so
# 1.8.0 will still be held to the bytes v1.7.0 emitted. Samples introduced by
# the release under development have no earlier reference and are reported
# without failing (`--strict` opts into failing on those too).
#
# Most samples are compared byte-for-byte: every call pins `creationDate` /
# `signingTime` / `modDate` (and the process-wide creation-date pin) and the
# harness pins TZ=UTC, which makes unencrypted output a pure function of its
# inputs. The encrypted samples can never repeat their bytes (CSPRNG file key
# and AES IVs, ISO 32000-1 §7.6) and the signed ones carry a per-run key, so
# those are compared through a canonical projection of the document instead. Samples that need a TSA or an OCSP
# responder are not generated at all: the gate is hermetic.
#
# ── Why there is no `paths:` filter ──────────────────────────────────
# This job is meant to be a REQUIRED status check. A path-filtered workflow
# simply does not run on a pull request that touches none of its paths, and a
# required check that never reports leaves the pull request stuck on
# "Expected — waiting for status to be reported", forever unmergeable. So the
# workflow always runs and decides internally whether the expensive work is
# warranted, which keeps the check reported on every pull request.
#
# Blocking on merge is a repository setting, not a file: "sample-regression"
# is listed in .github/rulesets/main.json; import that ruleset for the check
# to prevent merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed to diff against the pull request's base commit.
          fetch-depth: 0

      # A pdfnative bump changes bytes (the lockfile is in scope); so does
      # anything under src/, examples/, scripts/ or the fixtures the samples use.
      # The event values reach the script through `env:`, never through a
      # `${{ }}` interpolation inside `run:` (template injection, zizmor).
      - name: Decide whether emitted output can have changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}"...HEAD \
            | grep -Eq '^(src/|examples/|scripts/|tests/_fixtures/|package\.json$|package-lock\.json$|tsconfig(\.build)?\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo 'No change under src/, examples/, scripts/, the fixtures or the manifests — emitted output cannot have changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci --ignore-scripts

      # The generator drives dist/server.js, never the source tree.
      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - name: Generate samples
        if: steps.scope.outputs.run == 'true'
        run: npm run test:generate

      - name: Verify samples against the baseline chain
        if: steps.scope.outputs.run == 'true'
        run: npx tsx scripts/verify-samples.ts

      - name: Report divergences
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo '## Sample regression'
            echo
            echo 'A tracked sample no longer emits what its reference release emitted.'
            echo 'If the change is intended, say so in the release notes and rebaseline with:'
            echo
            echo '```'
            echo 'npm run build && npm run test:generate && npx tsx scripts/verify-samples.ts --update'
            echo '```'
            echo
            echo '```json'
            npx tsx scripts/verify-samples.ts --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diverged samples on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-regression-output
          path: test-output/
          retention-days: 7
