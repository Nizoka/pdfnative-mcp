name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# pdfnative-mcp has exactly three runtime dependencies (pdfnative, the MCP SDK,
# zod), so this covers the dev toolchain and any attempt to add a fourth
# runtime one — the project's first hard rule.
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # api.deps.dev and api.securityscorecards.dev: the action's OpenSSF
          # Scorecard column (show-openssf-scorecard, on by default) resolves
          # each changed package to its repository and fetches its score;
          # without them the step dies with a bare "fetch failed".
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # BlueOak-1.0.0 (OSI-approved permissive licence of tar / minipass /
          # chownr / isexe / yallist) and CC-BY-4.0 (the caniuse-lite data
          # table) come in through the Jazzer.js tree of the fuzz engine
          # (.clusterfuzzlite/engine, a CI tool that never ships). The three
          # runtime dependencies of the package stay MIT / ISC.
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, CC-BY-4.0
          comment-summary-in-pr: on-failure
