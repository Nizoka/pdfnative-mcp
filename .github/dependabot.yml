version: 2

# Every ecosystem waits seven days after a release before a version update is
# proposed (a release that is pulled, or followed by a fix, within a week never
# reaches a pull request — the same cooldown as pdfnative; Dependabot's own
# default is three days). The cooldown applies to version updates only —
# security updates are never delayed.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tsx"
        update-types: ["version-update:semver-major"]
      # engines.node is >= 22 and .nvmrc pins 22: the type definitions follow
      # the Node line, not the newest major (rule node-pin-parity).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci):"
    groups:
      github-actions:
        patterns:
          - "*"

  # The coverage-guided fuzzing engine of .clusterfuzzlite/build.sh (Jazzer.js),
  # pinned by its own manifest and lockfile and never a dependency of the package.
  - package-ecosystem: npm
    directory: /.clusterfuzzlite/engine
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(fuzz):"

  # The ClusterFuzzLite build image, pinned by digest in .clusterfuzzlite/Dockerfile.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(fuzz):"
